<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Librería</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: #e2e8f0;
    text-align: center;
}

.container {
    width: 90%;
    margin: auto;
}

h1 {
    color: #38bdf8;
    margin-top: 20px;
}

table {
    width: 100%;
    background: #1e293b;
    border-collapse: collapse;
    margin-top: 20px;
    border-radius: 10px;
    overflow: hidden;
}

th {
    background: #38bdf8;
    color: black;
    padding: 12px;
}

td {
    padding: 12px;
    border-bottom: 1px solid #334155;
}

tr:hover {
    background: #334155;
}

form {
    margin-top: 30px;
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    display: inline-block;
}

input {
    padding: 10px;
    margin: 8px;
    width: 220px;
    border-radius: 5px;
    border: none;
}

input:focus {
    outline: 2px solid #38bdf8;
}

button {
    padding: 10px 20px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
}

.btn-agregar {
    background: #22c55e;
    color: white;
}

.btn-eliminar {
    background: #ef4444;
    color: white;
}

.btn-agregar:hover {
    background: #16a34a;
}

.btn-eliminar:hover {
    background: #dc2626;
}
</style>
</head>

<body>

<div class="container">

<h1> Librería</h1>

<table>
<tr>
    <th>ID</th>
    <th>Título</th>
    <th>Año</th>
    <th>Autor</th>
    <th>Género</th>
    <th>Acción</th>
</tr>

{% for libro in libros %}
<tr>
    <td>{{ libro[0] }}</td>
    <td>{{ libro[1] }}</td>
    <td>{{ libro[2] }}</td>
    <td>{{ libro[3] }}</td>
    <td>{{ libro[4] }}</td>
    <td>
        <a href="/eliminar/{{ libro[0] }}">
            <button class="btn-eliminar">🗑</button>
        </a>
    </td>
</tr>
{% endfor %}
</table>

<h2>➕ Agregar libro</h2>

<form action="/agregar" method="POST">

<input type="text" name="titulo" placeholder="Título" required><br>

<input type="number" name="anio" placeholder="Año" required><br>

<input type="text" name="autor" placeholder="Autor" required><br>

<input type="text" name="genero" placeholder="Género" required><br>

<button class="btn-agregar">Guardar</button>

</form>

</div>

</body>
</html>
