<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial;
}

form {
    background: #1e293b;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}

input {
    padding: 10px;
    margin: 10px;
    width: 220px;
    border-radius: 5px;
    border: none;
}

button {
    padding: 10px 20px;
    background: #38bdf8;
    border: none;
    border-radius: 5px;
}
</style>
</head>

<body>

<form action="/login" method="POST">
    <h2>🔐 Iniciar Sesión</h2>
    <input type="text" name="user" placeholder="Usuario"><br>
    <input type="password" name="pass" placeholder="Contraseña"><br>
    <button>Entrar</button>
</form>

</body>
</html>
