<!-- templates/login.html -->

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Login</title>

<style>

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.login{
    background:#1e293b;
    padding:40px;
    border-radius:15px;
    width:320px;
    text-align:center;
}

h1{
    color:#38bdf8;
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#38bdf8;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0ea5e9;
}

</style>

</head>

<body>

<div class="login">

<h1>🔐 Iniciar Sesión</h1>

<form action="/login" method="POST">

<input
    type="text"
    name="user"
    placeholder="Usuario"
    required
>

<input
    type="password"
    name="pass"
    placeholder="Contraseña"
    required
>

<button>
    Entrar
</button>

</form>

</div>

</body>
</html>
